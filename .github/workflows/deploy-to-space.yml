name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  minimum-provider-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run full suite with minimum provider SDKs
        run: |
          pip install -r requirements.txt pytest pytest-asyncio \
            "openai==1.60.0" "huggingface_hub==0.32.6"
          PYTHONPATH=.:server pytest -q

  test:
    needs: minimum-provider-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          PYTHONPATH=.:server pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify frontend
        run: |
          npm ci --prefix web
          npm audit --omit=dev --audit-level=high --prefix web
          npm run build --prefix web

      - name: Verify production container
        run: |
          docker build -t synthline-release-check .
          docker run -d --name synthline-release-check -p 7861:7860 synthline-release-check
          trap 'docker rm -f synthline-release-check' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:7861/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs synthline-release-check
          exit 1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HF_SPACE_REPO: abdelkarim-elhajjami/synthline
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ]; then
            echo "Secrets are missing! Please check HF_TOKEN and HF_USERNAME."
            exit 1
          fi

          echo "Pushing to Hugging Face Space: $HF_SPACE_REPO"
          
          # Remove GitHub-only files not needed on HF Spaces
          rm -rf docs/ .github/ tests/ LICENSE README.md

          # Generate HF Space README with required frontmatter
          cat > README.md << 'SPACE_README'
---
title: Synthline
emoji: ⚡
colorFrom: purple
colorTo: yellow
sdk: docker
app_port: 7860
license: apache-2.0
---

# Synthline

Feature Model–Guided Synthetic Data Generator.

Generate constrained synthetic text classification datasets whose structure is governed by a FeatureIDE feature model.

For documentation and the Python SDK, visit the [GitHub repository](https://github.com/abdelkarim-elhajjami/Synthline).
SPACE_README

          # Reinitialize Git to push only current file contents.
          rm -rf .git
          git init
          git checkout -b main
          
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git add .
          git commit -m "Deploy to Spaces"
          
          # Force push to the canonical public Space.
          git remote add space https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_REPO
          git push -f space main

name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  minimum-provider-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run full suite with minimum provider SDKs
        run: |
          pip install -r requirements.txt pytest pytest-asyncio \
            "openai==1.60.0" "huggingface_hub==0.32.6"
          PYTHONPATH=.:server pytest -q

  test:
    needs: minimum-provider-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          PYTHONPATH=.:server pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify frontend
        run: |
          npm ci --prefix web
          npm audit --omit=dev --audit-level=high --prefix web
          npm run build --prefix web

      - name: Verify production container
        run: |
          docker build -t synthline-release-check .
          docker run -d --name synthline-release-check -p 7861:7860 synthline-release-check
          trap 'docker rm -f synthline-release-check' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:7861/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs synthline-release-check
          exit 1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HF_SPACE_REPO: abdelkarim-elhajjami/synthline
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Secret is missing! Please check HF_TOKEN."
            exit 1
          fi

          echo "Uploading to Hugging Face Space: $HF_SPACE_REPO"
          
          SPACE_DIR="$(mktemp -d)"
          export SPACE_DIR
          tar --exclude=.git -cf - . | tar -xf - -C "$SPACE_DIR"

          # Remove GitHub-only files not needed on HF Spaces.
          rm -rf "$SPACE_DIR/docs" "$SPACE_DIR/.github" "$SPACE_DIR/tests" \
                 "$SPACE_DIR/LICENSE" "$SPACE_DIR/README.md"

          # Generate HF Space README with required frontmatter.
          {
            echo "---"
            echo "title: Synthline"
            echo "emoji: ⚡"
            echo "colorFrom: purple"
            echo "colorTo: yellow"
            echo "sdk: docker"
            echo "app_port: 7860"
            echo "license: apache-2.0"
            echo "---"
            echo
            echo "# Synthline"
            echo
            echo "Feature Model–Guided Synthetic Data Generator."
            echo
            echo "Generate constrained synthetic text classification datasets whose structure is governed by a FeatureIDE feature model."
            echo
            echo "For documentation and the Python SDK, visit the [GitHub repository](https://github.com/abdelkarim-elhajjami/Synthline)."
          } > "$SPACE_DIR/README.md"

          python -m pip install --upgrade "huggingface_hub==0.32.6"
          python -c "import os; from huggingface_hub import HfApi; api = HfApi(token=os.environ['HF_TOKEN']); commit = api.upload_folder(repo_id=os.environ['HF_SPACE_REPO'], repo_type='space', folder_path=os.environ['SPACE_DIR'], commit_message='Deploy to Spaces', delete_patterns=['*']); print(f'Uploaded Space commit: {commit.commit_url}')"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthline"
version = "0.3.0"
description = "Feature Model–Guided Synthetic Data Generator"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Abdelkarim El Hajjami" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "openai>=1.60.0",
    "pandas>=2.0.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "scikit-learn>=1.0.0",
    "numpy>=1.21.0",
    "PyYAML>=6.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.24.0",
    "build>=1.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.12.0",
    "websockets>=11.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/abdelkarim-elhajjami/Synthline"
Repository = "https://github.com/abdelkarim-elhajjami/Synthline"
Issues = "https://github.com/abdelkarim-elhajjami/Synthline/issues"

[project.scripts]
synthline = "synthline.cli:main"

[tool.setuptools.packages.find]
include = ["synthline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "server"]
markers = [
    "asyncio: mark test as async-compatible",
]
